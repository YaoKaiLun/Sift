name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate Icons
        run: python3 Scripts/create_icons.py

      - name: Package
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/package.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sift
          path: dist/Sift-*.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Sift-*.dmg
