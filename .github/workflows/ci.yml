name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Packaging unit tests
        run: |
          python3 Scripts/test_version.py
          python3 Scripts/test_create_icons.py
          python3 Scripts/test_release_notes.py

      - name: Preflight
        run: ./Scripts/preflight.sh

      - name: Build app
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/build.sh
